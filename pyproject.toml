[project]
name = "hotel-demo"
version = "0.1.0"
description = "Hotel cancellation model, daily scoring, and legacy monitoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.0.0",
    "mlflow>=2.15.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.scripts]
hotel-demo = "hotel_demo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108"]

[tool.pytest.ini_options]
timeout = 120
timeout_method = "thread"
testpaths = ["tests"]
